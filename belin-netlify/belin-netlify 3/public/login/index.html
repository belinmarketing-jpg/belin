<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход и регистрация — BELIN</title><link rel="stylesheet" href="/assets/platform.css"></head><body><div class="shell"><header class="top"><a class="brand" href="/">belin<span>.</span></a><a class="sub" href="/">← На главную</a></header><main class="card auth"><p class="muted">BELIN PLATFORM</p><h1 id="heading">Войти в аккаунт</h1><p class="muted" id="subtitle">Управляйте всеми своими сайтами в одном месте.</p><div class="tabs"><button class="active" type="button" id="loginTab">Вход</button><button type="button" id="registerTab">Регистрация</button></div><form id="authForm"><label for="email">Электронная почта</label><input type="email" id="email" autocomplete="email" required placeholder="name@company.ru"><label for="password">Пароль</label><input type="password" id="password" minlength="6" autocomplete="current-password" required placeholder="Не менее 6 символов"><button class="full" id="submitBtn" type="submit">Войти</button></form><button type="button" class="secondary full" id="resetBtn">Забыли пароль?</button><div id="message" class="message" role="status" aria-live="polite"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="/assets/platform.js"></script><script>
(async()=>{const sb=window.belinAuth;const q=id=>document.getElementById(id);let mode='login';const setMessage=(s,error=false)=>{q('message').textContent=s;q('message').className='message '+(error?'error':'ok')};function setMode(m){mode=m;q('loginTab').classList.toggle('active',m==='login');q('registerTab').classList.toggle('active',m==='register');q('heading').textContent=m==='login'?'Войти в аккаунт':'Создать аккаунт';q('submitBtn').textContent=m==='login'?'Войти':'Зарегистрироваться';q('password').autocomplete=m==='login'?'current-password':'new-password';q('resetBtn').classList.toggle('hide',m==='register');setMessage('')}q('loginTab').onclick=()=>setMode('login');q('registerTab').onclick=()=>setMode('register');q('authForm').onsubmit=async e=>{e.preventDefault();const email=q('email').value.trim(),password=q('password').value;const btn=q('submitBtn');btn.disabled=true;setMessage('Подождите…');try{if(mode==='register'){const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://belin.su/dashboard/'}});if(error)throw error;setMessage(data.session?'Аккаунт создан. Перенаправляем…':'Проверьте почту: мы отправили письмо для подтверждения.');if(data.session)location.href='/dashboard/'}else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;location.href='/dashboard/'}}catch(err){setMessage(err.message||'Ошибка авторизации',true)}finally{btn.disabled=false}};q('resetBtn').onclick=async()=>{const email=q('email').value.trim();if(!email){setMessage('Сначала укажите email.',true);return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://belin.su/login/'});setMessage(error?error.message:'Если адрес зарегистрирован, на почту придёт письмо для восстановления.',!!error)};const {data:{session}}=await sb.auth.getSession();if(session)location.replace('/dashboard/');if(location.hash.includes('type=recovery'))setMessage('Перейдите по ссылке из письма для восстановления.');})();
</script></body></html>
