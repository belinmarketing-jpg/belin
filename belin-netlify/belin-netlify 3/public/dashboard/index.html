<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои сайты — BELIN Platform</title><link rel="stylesheet" href="/assets/platform.css"></head><body><div class="shell"><header class="top"><a class="brand" href="/">belin<span>.</span></a><div class="row"><span id="userEmail" class="sub"></span><button class="secondary" id="logout">Выйти</button></div></header><main style="margin-top:75px"><p class="muted">BELIN PLATFORM / ЛИЧНЫЙ КАБИНЕТ</p><h1 class="page-title">Мои сайты</h1><p class="muted">Здесь появятся сайты, приобретённые в BELIN.</p><div id="status" class="message" role="status">Загружаем сайты…</div><div id="sites"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="/assets/platform.js"></script><script>
(async()=>{const sb=window.belinAuth;const email=document.getElementById('userEmail'),status=document.getElementById('status'),container=document.getElementById('sites');const {data:{user},error:authError}=await sb.auth.getUser();if(authError||!user){location.replace('/login/');return}email.textContent=user.email||'Аккаунт';document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.replace('/login/')};const {data,error}=await sb.from('customer_sites').select('*').limit(100);if(error){status.textContent='Не удалось загрузить сайты. Проверьте создание таблицы customer_sites и её политики доступа.';status.className='message error';return}status.textContent='';if(!data?.length){const el=document.createElement('div');el.className='empty';const h=document.createElement('h2');h.textContent='У вас пока нет сайтов';const p=document.createElement('p');p.className='muted';p.textContent='Когда вы приобретёте шаблон, ваш сайт появится здесь.';el.append(h,p);container.append(el);return}for(const site of data){const card=document.createElement('article');card.className='site';const left=document.createElement('div');const title=document.createElement('h3');title.textContent=site.name||site.title||site.site_name||'Сайт';const desc=document.createElement('div');desc.className='sub';desc.textContent=site.subdomain||site.domain||site.slug||'BELIN Site';left.append(title,desc);card.append(left);const state=document.createElement('span');state.className='badge';state.textContent=site.status||'Черновик';card.append(state);container.append(card)}})();
</script></body></html>
